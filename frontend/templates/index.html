<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ridgeline · Trekking Management</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
    crossorigin="anonymous"
  />
  <!-- Bootstrap Icons -->
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --bs-body-font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --bs-body-bg: #f7f5f1;
      --bs-body-color: #1c1f1a;
      --ridge: #2f4a3a;
      --ridge-soft: #e6ece6;
    }
    body { font-family: var(--bs-body-font-family); }
    .display-serif { font-family: "Fraunces", Georgia, serif; letter-spacing: -0.01em; }
    .text-ridge { color: var(--ridge) !important; }
    .bg-ridge { background-color: var(--ridge) !important; color: #fff; }
    .bg-ridge-soft { background-color: var(--ridge-soft) !important; }
    .btn-ridge { background-color: var(--ridge); color: #fff; border-color: var(--ridge); }
    .btn-ridge:hover { background-color: #243a2d; color: #fff; border-color: #243a2d; }
    .btn-outline-ridge { color: var(--ridge); border-color: var(--ridge); }
    .btn-outline-ridge:hover { background-color: var(--ridge); color: #fff; }
    .border-ridge { border-color: var(--ridge) !important; }
    .card-trek-img {
      aspect-ratio: 16/10;
      background: repeating-linear-gradient(135deg, #d8d2c4 0 12px, #cfc8b7 12px 24px);
      position: relative;
      overflow: hidden;
    }
    .card-trek-img .placeholder-label {
      position: absolute; inset: auto 0 0 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      padding: 4px 8px;
      color: #5a5345;
      background: rgba(255,255,255,0.55);
      backdrop-filter: blur(2px);
    }
    .ridge-divider {
      height: 1px; background: linear-gradient(to right, transparent, #c8c1b1, transparent);
    }
    @media (min-width: 992px) {
      .filter-sticky { position: sticky; top: 88px; }
    }
    .trek-card { transition: transform .15s ease, box-shadow .15s ease; }
    .trek-card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(20,30,20,.08); }
    .stat-num { font-family: "Fraunces", Georgia, serif; font-weight: 600; font-size: 2.4rem; line-height: 1; letter-spacing: -0.02em; }
    .nav-link.router-link-active { font-weight: 600; color: var(--ridge) !important; }
    .toast-container { z-index: 1100; }
    .chart-box { position: relative; height: 280px; }
    .topo {
      background-image:
        radial-gradient(circle at 20% 30%, rgba(47,74,58,.08) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 60%, rgba(47,74,58,.06) 0 1px, transparent 1.5px),
        radial-gradient(circle at 40% 80%, rgba(47,74,58,.05) 0 1px, transparent 1.5px);
      background-size: 28px 28px, 36px 36px, 44px 44px;
    }
    .py-6 { padding-top: 5rem; padding-bottom: 5rem; }
    @media (min-width: 992px) {
      .py-lg-6 { padding-top: 7rem; padding-bottom: 7rem; }
    }

    @keyframes ridgeFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    #app > div { animation: ridgeFadeIn .4s ease both; }
  </style>
</head>

<body class="bg-body">
  <div id="app">
    <!-- Mounted by Vue -->
    <div class="d-flex align-items-center justify-content-center min-vh-100 text-muted">
      <div class="text-center">
        <div class="spinner-border text-ridge mb-3" role="status" aria-hidden="true"></div>
        <div>Loading Ridgeline…</div>
      </div>
    </div>
  </div>

  <!-- Toast portal -->
  <div class="toast-container position-fixed top-0 end-0 p-3" id="toast-portal"></div>

  <!-- Vendor scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
          integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
          crossorigin="anonymous"></script>
  <script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
  <script src="https://unpkg.com/vue-router@4.4.3/dist/vue-router.global.prod.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.4/dist/axios.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>

  <!-- Backend config injected by Jinja2 -->
  <script>window.__API_BASE__ = "{{ api_base }}";</script>

  <!-- App scripts (order matters) -->
  <script src="static/js/mock-api.js"></script>
  <script src="static/js/api.js"></script>
  <script src="static/js/store.js"></script>
  <script src="static/js/util.js"></script>

  <!-- Shared components -->
  <script src="static/js/components/navbar.js"></script>
  <script src="static/js/components/trek-card.js"></script>
  <script src="static/js/components/landing-sections.js"></script>
  <script src="static/js/components/trek-modal.js"></script>
  <script src="static/js/components/checkout-modal.js"></script>
  <script src="static/js/components/confirm-modal.js"></script>

  <!-- Views -->
  <script src="static/js/views/home.js"></script>
  <script src="static/js/views/login.js"></script>
  <script src="static/js/views/register.js"></script>
  <script src="static/js/views/profile.js"></script>
  <script src="static/js/views/catalog.js"></script>
  <script src="static/js/views/my-bookings.js"></script>
  <script src="static/js/views/admin-dashboard.js"></script>
  <script src="static/js/views/admin-treks.js"></script>
  <script src="static/js/views/admin-users.js"></script>
  <script src="static/js/views/staff-dashboard.js"></script>
  <script src="static/js/views/staff-trek.js"></script>

  <!-- Boot -->
  <script src="static/js/app.js"></script>
</body>
</html>
